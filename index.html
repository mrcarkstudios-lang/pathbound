<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#150b33" />
  <meta name="description" content="PATHBOUND: plan Maria's route tile by tile, then press PLAY and watch it happen. 100 handmade puzzle levels." />
  <meta property="og:title" content="PATHBOUND" />
  <meta property="og:description" content="Plan the path. Then watch it happen." />
  <meta property="og:image" content="/art/brand/social-share-1200x630.webp" />
  <title>PATHBOUND</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="bg"><div class="layer cur"></div><div class="layer next"></div><div class="shade"></div></div>
  <canvas id="c"></canvas>

  <div id="studio" class="hidden">
    <div class="st-bg"></div>
    <div class="st-rays"></div><div class="st-glow"></div><div class="st-sparks" id="stSparks"></div><div class="st-flash"></div>
    <div class="st-streak"></div>
    <div class="st-center">
      <div class="st-emb"><img src="/art/brand/gamics-emblem.webp" alt="GAMECIS" /><i class="st-sweep"></i><b class="st-ring"></b></div>
      <div class="st-word" aria-label="GAMECIS"><span>G</span><span>A</span><span>M</span><span>E</span><span>C</span><span>I</span><span>S</span></div>
      <div class="st-sub"><i></i><b>PRESENTS</b><i></i></div>
    </div>
    <div id="cine"><div class="cine-flash"></div><div class="cine-ring"></div><img class="cine-logo" src="/art/brand/logo-full.webp" alt="PATHBOUND" /></div>
    <div class="st-vig"></div>
    <button id="studioSkip" class="hidden">Skip ▸</button>
  </div>

  <div id="loading" class="screen">
    <img class="emblem" src="/art/brand/logo-emblem.webp" alt="" />
    <img class="logo" src="/art/brand/logo-full.webp" alt="PATHBOUND" />
    <div class="barwrap"><div id="loadFill"></div></div>
    <div class="sub" id="loadText">Loading…</div>
    <div class="tip" id="loadTip"></div>
    <div class="byline"><img src="/art/brand/gamics-emblem.webp" alt="" /><span>A <b>GAMECIS</b> game</span></div>
  </div>

  <div id="title" class="screen hidden">
    <div class="topbar"><div class="pill" id="pillStars"></div><button class="pill" id="pillHints"></button></div>
    <div class="head"><img class="logo" src="/art/brand/logo-full.webp" alt="PATHBOUND" /><div class="tag" id="tagline">Plan the path. Then watch it happen.</div></div>
    <div class="foot"><div class="menu">
      <button id="btnStart" class="b gold big"><span id="startLabel">Play</span></button>
      <button id="btnLevels" class="b purple">Levels</button>
    </div>
    <div class="dock">
      <button class="rb" id="dkShop" title="Shop"><img src="/art/ui/icon-shop.webp" alt="Shop" /></button>
      <button class="rb" id="dkDaily" title="Daily gift"><img src="/art/ui/icon-gift.webp" alt="Daily gift" /><i class="dot hidden" id="dailyDot"></i></button>
      <button class="rb" id="dkNoAds" title="Remove ads"><img src="/art/ui/icon-no-ads.webp" alt="Remove ads" /></button>
      <button class="rb" id="dkSettings" title="Settings"><img src="/art/ui/icon-settings.webp" alt="Settings" /></button>
    </div></div>
  </div>

  <div id="select" class="screen hidden">
    <div class="bar"><button id="selBack" class="rb"><img src="/art/ui/icon-back.webp" alt="Back" /></button><div class="h" id="selTitle">World</div><div class="pill" id="selStars"></div></div>
    <div id="worldCards"></div>
    <div id="worldInfo"></div>
    <div id="levelGrid"></div>
    <div id="nativeSlot" class="hidden"></div>
  </div>

  <div id="hud" class="hidden">
    <div class="top">
      <button id="btnBack" class="rb"><img src="/art/ui/icon-back.webp" alt="Back" /></button>
      <div class="info"><div id="lvName"></div><div id="lvMeta"></div></div>
      <div class="chips"><span id="chipRune" class="chip"></span><span id="chipCoins" class="chip"></span><span id="chipSteps" class="chip"></span></div>
    </div>
    <div class="bottom">
      <button id="btnUndo" class="rb" title="Undo"><img src="/art/ui/icon-undo.webp" alt="Undo" /></button>
      <button id="btnClear" class="rb" title="Clear route"><img src="/art/ui/icon-clear.webp" alt="Clear" /></button>
      <button id="btnPlay" class="b gold play"><img src="/art/ui/icon-play.webp" alt="" /><span>PLAY</span></button>
      <button id="btnWait" class="b gold play"><img src="/art/ui/icon-wait.webp" alt="" /><span>WAIT</span></button>
      <button id="btnRotate" class="rb" title="Rotate camera (Q / E). Two fingers: pinch to zoom, twist to rotate"><img src="/art/ui/icon-rotate.webp" alt="Rotate view" /></button>
      <button id="btnZoomOut" class="rb txt" title="Zoom out">−</button>
      <button id="btnZoomIn" class="rb txt" title="Zoom in">+</button>
      <button id="btnSpeed" class="rb txt" title="Speed">1x</button>
      <button id="btnHint" class="rb" title="Hint"><img src="/art/ui/icon-hint.webp" alt="Hint" /><i class="badge" id="hintBadge">3</i></button>
    </div>
  </div>

  <div id="rotateMsg"><img src="/art/ui/icon-rotate.webp" alt="" /><b>Turn your phone sideways</b><span>PATHBOUND is played in landscape</span></div>
  <div id="coach" class="hidden"><img class="av" src="/art/ui/rune-might.webp" alt="" /><div class="tx"><b></b><span></span></div><button class="skip hidden">Skip</button></div>
  <div id="pointer" class="hidden"><i class="ripple"></i><svg class="hand" viewBox="0 0 64 84" aria-hidden="true"><path d="M23 7a8 8 0 0 1 16 0v27l4-1a6 6 0 0 1 8 5l1 1a6 6 0 0 1 8 6v13c0 13-9 25-24 25h-4c-9 0-14-4-19-11L5 54a6 6 0 0 1 9-8l9 7z" fill="#fff" stroke="#2a1250" stroke-width="4" stroke-linejoin="round"/><path d="M31 36v14M43 40v12M52 45v11" stroke="#b9a8e6" stroke-width="3" stroke-linecap="round"/></svg></div>
  <div id="toast" class="hidden"></div>
  <div id="sheet" class="hidden"><div class="card"><button id="shClose" class="xbtn hidden" aria-label="Close">✕</button><div class="ribbon" id="shTitle"></div><div id="shBody"></div></div></div>

  <!-- development ad screens (shown only by the "sim" provider) -->
  <div id="adSim" class="hidden"><div class="adBox"><div class="adLabel"></div><div class="adArt">AD</div><div class="adLeft"></div><button class="b purple adClose">Close</button></div></div>
  <div id="adBanner" class="hidden">Test banner ad</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
